<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171b17">
  <title>日常練習｜自主間歇計時器</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap');
    :root{--ink:#171b17;--paper:#f3f0e8;--card:#fffdf7;--line:#ded9cc;--muted:#74766f;--green:#275d47;--lime:#d9ed82;--orange:#ef8354;--blue:#5e7b87;--red:#b64a3e;--shadow:0 18px 50px rgba(31,38,31,.09)}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;min-height:100vh} button,input,select{font:inherit} button{cursor:pointer}
    .shell{max-width:1120px;margin:auto;padding:22px clamp(16px,4vw,48px) 80px}
    header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:42px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:42px;height:42px;border-radius:14px;background:var(--ink);display:grid;place-items:center;color:var(--lime);font-weight:900;transform:rotate(-3deg)}.brand-name{font-size:18px;font-weight:900;letter-spacing:.08em}.brand small{display:block;color:var(--muted);font-weight:500;letter-spacing:0}.header-actions{display:flex;gap:9px}
    .btn{border:0;border-radius:13px;padding:12px 17px;font-weight:800;background:var(--ink);color:white;transition:.18s transform,.18s opacity}.btn:hover{transform:translateY(-2px)}.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.soft{background:#e6e2d7;color:var(--ink)}.btn.danger{background:#f4dfda;color:var(--red)}
    .hero{display:grid;grid-template-columns:1.25fr .75fr;gap:28px;align-items:end;margin-bottom:28px}.eyebrow{color:var(--green);font-weight:900;font-size:13px;letter-spacing:.18em}.hero h1{font-size:clamp(38px,6vw,72px);line-height:1.05;letter-spacing:-.045em;margin:10px 0 14px;max-width:780px}.hero p{color:var(--muted);line-height:1.8;margin:0;max-width:620px}.hero-note{border-left:3px solid var(--orange);padding:5px 0 5px 18px;color:var(--muted);font-size:14px;line-height:1.7}
    .layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:24px}.card{background:var(--card);border:1px solid rgba(80,80,65,.13);border-radius:24px;padding:24px;box-shadow:var(--shadow)}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.card-head h2{font-size:21px;margin:0}.count{font-size:13px;color:var(--muted);font-weight:700}
    .settings{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}.field{background:#f5f2e9;border-radius:15px;padding:12px}.field label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:6px}.field-row{display:flex;align-items:center;gap:5px}.field input{min-width:0;width:100%;border:0;background:transparent;font-size:20px;font-weight:900;outline:0}.unit{font-size:12px;color:var(--muted)}
    .workout-list{display:flex;flex-direction:column;gap:10px;min-height:120px}.empty{text-align:center;padding:35px 15px;color:var(--muted);border:1.5px dashed var(--line);border-radius:17px}.workout-item{display:grid;grid-template-columns:34px 1fr auto;gap:11px;align-items:center;border:1px solid var(--line);border-radius:17px;padding:12px;background:white}.drag{color:#aaa;font-size:20px;cursor:grab}.item-name{font-weight:900}.item-meta{color:var(--muted);font-size:12px;margin-top:3px}.tag{display:inline-flex;background:#edf0e8;color:var(--green);padding:3px 7px;border-radius:20px;font-weight:700;margin-right:4px}.side-tag{background:#f7e7d9;color:#9a542f}.item-actions{display:flex;gap:5px}.icon-btn{border:0;background:#f1eee6;color:var(--muted);width:34px;height:34px;border-radius:10px;font-weight:900}.start{width:100%;padding:18px;margin-top:18px;border-radius:17px;font-size:18px;background:var(--green);color:white;border:0;font-weight:900}.start:disabled{opacity:.45;cursor:not-allowed}
    .library{position:sticky;top:18px;align-self:start}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:8px;margin-bottom:10px}.filter{white-space:nowrap;border:1px solid var(--line);background:transparent;border-radius:20px;padding:7px 11px;color:var(--muted);font-size:12px;font-weight:800}.filter.active{background:var(--ink);color:white;border-color:var(--ink)}.search{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px 13px;background:white;outline:0;margin-bottom:12px}.moves{max-height:490px;overflow:auto;padding-right:4px}.move{width:100%;border:0;border-bottom:1px solid #ebe7dd;background:transparent;padding:12px 4px;display:flex;align-items:center;text-align:left;gap:11px}.move:hover{background:#f7f4ec}.move-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#e8eedf;font-size:18px}.move-info{flex:1}.move-name{font-weight:800}.move-desc{font-size:11px;color:var(--muted);margin-top:2px}.plus{font-size:22px;color:var(--green)}
    dialog{border:0;padding:0;background:transparent;width:min(940px,calc(100% - 24px));max-width:none}dialog::backdrop{background:rgba(16,20,17,.72);backdrop-filter:blur(8px)}.timer{background:var(--ink);color:white;border-radius:30px;min-height:630px;padding:28px;display:flex;flex-direction:column;position:relative;overflow:hidden}.timer::after{content:'';position:absolute;width:360px;height:360px;border-radius:50%;background:var(--lime);filter:blur(100px);opacity:.12;right:-100px;top:60px}.timer-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}.phase-pill{background:var(--lime);color:var(--ink);border-radius:20px;padding:7px 12px;font-size:12px;font-weight:900;letter-spacing:.08em}.close{background:rgba(255,255,255,.1);border:0;color:white;width:40px;height:40px;border-radius:12px;font-size:18px}.timer-main{text-align:center;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:1}.progress-ring{width:min(310px,70vw);aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--lime) var(--progress,100%),rgba(255,255,255,.1) 0);display:grid;place-items:center;position:relative}.progress-ring::before{content:'';position:absolute;inset:10px;border-radius:50%;background:var(--ink)}.timer-copy{position:relative;z-index:1}.side-display{font-size:clamp(18px,4vw,28px);font-weight:900;color:var(--lime);min-height:38px}.seconds{font-size:clamp(82px,16vw,130px);font-weight:900;line-height:.9;letter-spacing:-.07em}.sec-label{color:#aeb4ae;font-size:13px;margin-top:10px}.current-name{font-size:clamp(24px,4vw,36px);font-weight:900;margin-top:24px}.progress-text{color:#aeb4ae;font-size:13px;margin-top:7px}.next{color:#aeb4ae;font-size:13px;margin-top:10px}.timer-controls{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:10px;position:relative;z-index:2}.timer-controls button{border:0;border-radius:16px;padding:16px 10px;background:rgba(255,255,255,.1);color:white;font-weight:900}.timer-controls .primary{background:var(--lime);color:var(--ink)}
    .done{display:none;text-align:center;flex:1;align-items:center;justify-content:center;flex-direction:column}.done.show{display:flex}.done-icon{font-size:58px}.done h2{font-size:44px;margin:8px 0}.done p{color:#b7bdb7}.done .btn{background:var(--lime);color:var(--ink);margin-top:20px}
    .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:white;padding:12px 18px;border-radius:13px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:99}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:820px){header{margin-bottom:28px}.hero{grid-template-columns:1fr}.hero-note{display:none}.layout{grid-template-columns:1fr}.library{position:static;order:-1}.moves{max-height:300px}.settings{grid-template-columns:1fr 1fr}.shell{padding-top:16px}.header-actions .ghost{display:none}.timer{min-height:calc(100dvh - 24px);border-radius:24px;padding:20px}.timer-controls{position:sticky;bottom:0}.card{padding:19px}.hero h1{font-size:43px}}
  </style>
</head>
<body>
<main class="shell">
  <header><div class="brand"><div class="brand-mark">間</div><div><div class="brand-name">日常練習</div><small>自主間歇計時器</small></div></div><div class="header-actions"><button class="btn ghost" id="resetBtn">清空課表</button><button class="btn soft" id="loadDemoBtn">載入新手課表</button></div></header>
  <section class="hero"><div><div class="eyebrow">MOVE AT YOUR OWN PACE</div><h1>好好動，<br>一次一組就好。</h1><p>挑選今天想做的動作，設定節奏，讓計時器幫你記住換邊、休息，以及下一步。</p></div><div class="hero-note">左右側動作會自動分成兩個階段，畫面會以大字提醒目前訓練側。</div></section>
  <section class="layout">
    <div class="card"><div class="card-head"><h2>今天的課表</h2><span class="count" id="countText">0 個動作</span></div>
      <div class="settings">
        <div class="field"><label>每組訓練</label><div class="field-row"><input id="workSec" type="number" min="5" max="600" value="40"><span class="unit">秒</span></div></div>
        <div class="field"><label>每個動作組數</label><div class="field-row"><input id="sets" type="number" min="1" max="20" value="2"><span class="unit">組</span></div></div>
        <div class="field"><label>組間休息</label><div class="field-row"><input id="setRest" type="number" min="0" max="600" value="20"><span class="unit">秒</span></div></div>
        <div class="field"><label>動作間大休息</label><div class="field-row"><input id="moveRest" type="number" min="0" max="900" value="45"><span class="unit">秒</span></div></div>
      </div>
      <div class="workout-list" id="workoutList"></div><button class="start" id="startBtn" disabled>開始今天的訓練</button>
    </div>
    <aside class="card library"><div class="card-head"><h2>動作資料庫</h2><span class="count">點一下加入</span></div><input class="search" id="search" placeholder="搜尋動作…"><div class="filters" id="filters"></div><div class="moves" id="moves"></div></aside>
  </section>
</main>
<dialog id="timerDialog"><section class="timer" id="timerPanel"><div class="timer-top"><span class="phase-pill" id="phasePill">準備</span><button class="close" id="closeTimer" aria-label="結束計時">✕</button></div><div class="timer-main" id="timerMain"><div class="progress-ring" id="ring"><div class="timer-copy"><div class="side-display" id="sideDisplay"></div><div class="seconds" id="seconds">5</div><div class="sec-label">秒</div></div></div><div class="current-name" id="currentName">準備開始</div><div class="progress-text" id="progressText"></div><div class="next" id="nextText"></div></div><div class="done" id="done"><div class="done-icon">✓</div><h2>完成了！</h2><p id="doneText"></p><button class="btn" id="doneBtn">回到課表</button></div><div class="timer-controls" id="controls"><button id="minusBtn">− 10 秒</button><button class="primary" id="pauseBtn">暫停</button><button id="skipBtn">跳過 →</button></div></section></dialog>
<div class="toast" id="toast"></div>
<script>
const MOVES=[
 {id:'deadbug',name:'死蟲式',cat:'核心',icon:'◒',desc:'核心穩定・徒手'}, {id:'plank',name:'棒式',cat:'核心',icon:'━',desc:'核心穩定・徒手'}, {id:'bird',name:'鳥狗式',cat:'核心',icon:'◇',desc:'核心與平衡・徒手',sides:true},
 {id:'clamshell',name:'蚌殼式',cat:'臀腿',icon:'◖',desc:'臀肌啟動・側躺',sides:true}, {id:'bridge',name:'橋式',cat:'臀腿',icon:'⌒',desc:'臀腿訓練・徒手'}, {id:'squat',name:'深蹲',cat:'臀腿',icon:'↕',desc:'下肢訓練・徒手'}, {id:'chair-squat',name:'椅子深蹲',cat:'臀腿',icon:'▱',desc:'新手友善・椅子'}, {id:'clock',name:'鐘面點地',cat:'臀腿',icon:'◷',desc:'平衡與臀腿・站姿',sides:true}, {id:'side-leg',name:'側向抬腿',cat:'臀腿',icon:'↗',desc:'臀外側・站姿',sides:true},
 {id:'row',name:'坐姿划船',cat:'彈力帶',icon:'←',desc:'背部訓練・彈力帶'}, {id:'press',name:'胸前推',cat:'彈力帶',icon:'→',desc:'胸肩訓練・彈力帶'}, {id:'pullapart',name:'彈力帶拉開',cat:'彈力帶',icon:'↔',desc:'上背與肩・彈力帶'}, {id:'wallpush',name:'牆壁伏地挺身',cat:'彈力帶',icon:'／',desc:'新手友善・徒手'},
 {id:'march',name:'原地踏步',cat:'有氧',icon:'♩',desc:'低衝擊有氧'}, {id:'sidestep',name:'左右側步',cat:'有氧',icon:'⇆',desc:'低衝擊有氧'}, {id:'jack',name:'無跳躍開合步',cat:'有氧',icon:'※',desc:'低衝擊有氧'}, {id:'boxing',name:'站姿出拳',cat:'有氧',icon:'⌁',desc:'全身有氧'},
 {id:'catcow',name:'貓牛式',cat:'伸展',icon:'∿',desc:'脊椎活動'}, {id:'child',name:'嬰兒式',cat:'伸展',icon:'⌣',desc:'背部放鬆'}, {id:'hipflex',name:'髖屈肌伸展',cat:'伸展',icon:'△',desc:'髖部伸展',sides:true}, {id:'hamstring',name:'大腿後側伸展',cat:'伸展',icon:'⌞',desc:'腿後側伸展',sides:true}, {id:'breath',name:'深呼吸放鬆',cat:'伸展',icon:'◎',desc:'恢復與收操'}
];
let selected=JSON.parse(localStorage.getItem('dailyWorkout')||'[]'); let activeCat='全部'; let state=null,tick=null,audioCtx=null;
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1800)}
function save(){localStorage.setItem('dailyWorkout',JSON.stringify(selected));renderWorkout()}
function renderFilters(){let cats=['全部',...new Set(MOVES.map(m=>m.cat))];$('#filters').innerHTML=cats.map(c=>`<button class="filter ${c===activeCat?'active':''}" data-cat="${c}">${c}</button>`).join('');$$('.filter').forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;renderFilters();renderMoves()})}
function renderMoves(){let q=$('#search').value.trim();let list=MOVES.filter(m=>(activeCat==='全部'||m.cat===activeCat)&&(!q||m.name.includes(q)||m.desc.includes(q)));$('#moves').innerHTML=list.map(m=>`<button class="move" data-id="${m.id}"><span class="move-icon">${m.icon}</span><span class="move-info"><span class="move-name">${m.name}</span><span class="move-desc">${m.desc}${m.sides?'・左右側':''}</span></span><span class="plus">＋</span></button>`).join('')||'<div class="empty">找不到這個動作</div>';$$('.move').forEach(b=>b.onclick=()=>addMove(b.dataset.id))}
function addMove(id){selected.push(id);save();toast('已加入 '+MOVES.find(m=>m.id===id).name)}
function renderWorkout(){let box=$('#workoutList');$('#countText').textContent=`${selected.length} 個動作`;$('#startBtn').disabled=!selected.length;if(!selected.length){box.innerHTML='<div class="empty">還沒有動作，從右側挑選加入吧</div>';return}box.innerHTML=selected.map((id,i)=>{let m=MOVES.find(x=>x.id===id);return `<div class="workout-item"><span class="drag">≡</span><div><div class="item-name">${i+1}. ${m.name}</div><div class="item-meta"><span class="tag">${m.cat}</span>${m.sides?'<span class="tag side-tag">左／右自動切換</span>':''}</div></div><div class="item-actions"><button class="icon-btn" data-up="${i}" aria-label="上移">↑</button><button class="icon-btn" data-del="${i}" aria-label="刪除">×</button></div></div>`}).join('');$$('[data-del]').forEach(b=>b.onclick=()=>{selected.splice(+b.dataset.del,1);save()});$$('[data-up]').forEach(b=>b.onclick=()=>{let i=+b.dataset.up;if(i){[selected[i-1],selected[i]]=[selected[i],selected[i-1]];save()}})}
function settings(){return {work:Math.max(5,+$('#workSec').value||40),sets:Math.max(1,+$('#sets').value||1),setRest:Math.max(0,+$('#setRest').value||0),moveRest:Math.max(0,+$('#moveRest').value||0)}}
function buildPhases(){let cfg=settings(),ph=[{type:'prepare',sec:5,name:'準備開始'}];selected.forEach((id,mi)=>{let m=MOVES.find(x=>x.id===id),sides=m.sides?['左側','右側']:[null];sides.forEach((side,si)=>{for(let set=1;set<=cfg.sets;set++){ph.push({type:'work',sec:cfg.work,name:m.name,side,set,sets:cfg.sets,mi,total:selected.length});if(set<cfg.sets&&cfg.setRest)ph.push({type:'rest',sec:cfg.setRest,name:m.name,side,set,sets:cfg.sets,mi,total:selected.length})}if(si<sides.length-1&&cfg.setRest)ph.push({type:'switch',sec:cfg.setRest,name:m.name,side:'換到右側',mi,total:selected.length})});if(mi<selected.length-1&&cfg.moveRest)ph.push({type:'bigrest',sec:cfg.moveRest,name:m.name,mi,total:selected.length})});return ph}
function startTimer(){state={phases:buildPhases(),idx:0,left:5,paused:false,started:Date.now()};$('#timerDialog').showModal();$('#timerMain').style.display='flex';$('#done').classList.remove('show');$('#controls').style.display='grid';loadPhase();tick=setInterval(step,1000);wakeLock()}
function current(){return state.phases[state.idx]}
function loadPhase(){let p=current();if(!p)return finish();state.left=p.sec;beep(p.type==='work'?700:440,.12);renderTimer()}
function step(){if(!state||state.paused)return;state.left--;if(state.left<=3&&state.left>0)beep(520,.06);if(state.left<=0){state.idx++;loadPhase()}else renderTimer()}
function phaseLabel(p){return {prepare:'準備',work:'訓練中',rest:'組間休息',switch:'換邊休息',bigrest:'動作間大休息'}[p.type]}
function nextWork(){for(let i=state.idx+1;i<state.phases.length;i++)if(state.phases[i].type==='work')return state.phases[i];return null}
function renderTimer(){let p=current(),pct=(state.left/p.sec*100)+'%';$('#ring').style.setProperty('--progress',pct);$('#seconds').textContent=state.left;$('#phasePill').textContent=phaseLabel(p);$('#phasePill').style.background=p.type==='work'?'var(--lime)':p.type==='prepare'?'#fff':'var(--orange)';$('#currentName').textContent=p.type==='work'?p.name:p.type==='prepare'?'準備開始':phaseLabel(p);$('#sideDisplay').textContent=p.type==='work'&&p.side?`目前：${p.side}`:p.type==='switch'?'接著：右側':'';$('#progressText').textContent=p.type==='work'?`動作 ${p.mi+1} / ${p.total}　·　第 ${p.set} / ${p.sets} 組`:'';let n=nextWork();$('#nextText').textContent=n?`下一步：${n.name}${n.side?'・'+n.side:''}`:'這是最後一個階段';$('#pauseBtn').textContent=state.paused?'繼續':'暫停'}
function skip(){if(!state)return;state.idx++;loadPhase()}
function finish(){clearInterval(tick);tick=null;beep(880,.18);setTimeout(()=>beep(1040,.2),180);$('#timerMain').style.display='none';$('#controls').style.display='none';$('#done').classList.add('show');let mins=Math.max(1,Math.round((Date.now()-state.started)/60000));$('#doneText').textContent=`完成 ${selected.length} 個動作，訓練約 ${mins} 分鐘。做得很好。`}
function stopTimer(){clearInterval(tick);tick=null;state=null;$('#timerDialog').close()}
function beep(freq,dur){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.12,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
async function wakeLock(){try{if('wakeLock'in navigator)await navigator.wakeLock.request('screen')}catch(e){}}
$('#search').oninput=renderMoves;$('#startBtn').onclick=startTimer;$('#pauseBtn').onclick=()=>{state.paused=!state.paused;renderTimer()};$('#skipBtn').onclick=skip;$('#minusBtn').onclick=()=>{state.left=Math.max(1,state.left-10);renderTimer()};$('#closeTimer').onclick=()=>{if(confirm('要結束這次訓練嗎？'))stopTimer()};$('#doneBtn').onclick=stopTimer;
$('#resetBtn').onclick=()=>{if(!selected.length||confirm('要清空目前課表嗎？')){selected=[];save()}};$('#loadDemoBtn').onclick=()=>{selected=['deadbug','clamshell','bridge','squat','clock','row','press','march','plank','catcow','breath'];save();toast('已載入新手課表')};
['workSec','sets','setRest','moveRest'].forEach(id=>$('#'+id).onchange=()=>localStorage.setItem('timerSettings',JSON.stringify(settings())));let stored=JSON.parse(localStorage.getItem('timerSettings')||'null');if(stored){$('#workSec').value=stored.work;$('#sets').value=stored.sets;$('#setRest').value=stored.setRest;$('#moveRest').value=stored.moveRest}
renderFilters();renderMoves();renderWorkout();
</script>
</body>
</html>
